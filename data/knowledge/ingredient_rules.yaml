conflicts:
  - id: retinoid_x_aha_bha
    group_a: [retinoid]
    group_b: [aha, bha]
    severity: SEPARATE
    scope: same_routine
    message: "Commonly recommended to use on alternate nights or in separate AM/PM routines to reduce irritation."

  - id: retinoid_x_benzoyl_peroxide
    group_a: [retinoid]
    group_b: [benzoyl_peroxide]
    severity: SEPARATE
    scope: same_routine
    message: "Benzoyl peroxide can degrade certain retinoids when applied together; use at separate times."

  - id: aha_x_bha_stacking
    group_a: [aha]
    group_b: [bha]
    severity: CAUTION
    scope: same_routine
    message: "Combining multiple direct hydroxy acids in the same routine increases risk of over-exfoliation."

  - id: vitamin_c_x_aha_bha
    group_a: [vitamin_c_acidic]
    group_b: [aha, bha]
    severity: CAUTION
    scope: same_routine
    message: "Stacking low-pH L-ascorbic acid with direct AHAs/BHAs may cause barrier irritation."

  - id: vitamin_c_x_niacinamide
    group_a: [vitamin_c_acidic]
    group_b: [niacinamide]
    severity: INFO
    scope: same_routine
    message: "Historically flagged as incompatible; modern formulation science confirms this combination is safe for most skin."

  - id: multi_exfoliant
    group_a: [aha, bha]
    group_b: [aha, bha]
    severity: CAUTION
    scope: same_routine
    message: "Multiple exfoliating products detected in routine; monitor for cumulative dryness or skin barrier strain."

  - id: pregnancy_retinoid
    group_a: [retinoid]
    group_b: []
    severity: BLOCK
    scope: any
    message: "Retinoids are strictly contra-indicated during pregnancy and lactation."

  - id: pregnancy_hydroquinone
    group_a: [hydroquinone]
    group_b: []
    severity: BLOCK
    scope: any
    message: "Hydroquinone is not recommended during pregnancy due to high systemic absorption."

  - id: sensitive_fragrance
    group_a: [fragrance]
    group_b: []
    severity: CAUTION
    scope: any
    message: "Added fragrance / aromatic essential oils may trigger sensitivity on reactive skin."

  - id: sensitive_alcohol
    group_a: [drying_alcohol]
    group_b: []
    severity: CAUTION
    scope: any
    message: "Drying simple alcohols can compromise sensitive or dry skin barrier integrity."

  - id: acne_comedogenic
    group_a: [comedogenic]
    group_b: []
    severity: CAUTION
    scope: any
    message: "Contains known comedogenic lipids that may clog pores on acne-prone skin."

  - id: duplicate_category
    group_a: []
    group_b: []
    severity: INFO
    scope: same_routine
    message: "Multiple products of the same functional category in the same routine slot."

ingredient_groups:
  retinoid: [retinol, retinal, retinaldehyde, tretinoin, adapalene, retinyl palmitate, hydroxypinacolone retinoate]
  aha: [glycolic acid, lactic acid, mandelic acid, citric acid]
  bha: [salicylic acid, betaine salicylate]
  vitamin_c_acidic: [ascorbic acid, l-ascorbic acid]
  benzoyl_peroxide: [benzoyl peroxide]
  niacinamide: [niacinamide]
  hydroquinone: [hydroquinone]
  fragrance: [fragrance, parfum, linalool, limonene, citronellol, geraniol]
  drying_alcohol: [alcohol denat, sd alcohol 40, isopropyl alcohol]
  comedogenic: [coconut oil, isopropyl myristate, isopropyl palmitate, sodium lauryl sulfate, algae extract]

flags:
  pregnancy_avoid: [retinoid, hydroquinone, tretinoin, adapalene]
  sensitive_avoid: [fragrance, drying_alcohol, aha, bha]
  acne_prone_avoid: [comedogenic]
